<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 76" fill="none">
  <!-- Shopping Cart with Upward Growth Arrow Icon -->
  <g transform="translate(6, 6)">
    <!-- Cart Base Body & Wheels -->
    <path d="M4 14h8l5 22h22l4.5-16H16" stroke="#185834" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="20" cy="42" r="3.8" fill="#185834"/>
    <circle cx="36" cy="42" r="3.8" fill="#185834"/>
    
    <!-- Goods Inside the Cart (Ketupat, Money Bag, Local Jar) -->
    <path d="M20 25l4-9 6 8z" fill="#2E7D4E"/>
    <circle cx="31" cy="20" r="4.2" fill="#EFA91F"/>
    <path d="M30 16l3-4h-4z" fill="#C98510"/>
    <rect x="23" y="24" width="7" height="6" rx="1.5" fill="#8D5B28"/>
    
    <!-- Dynamic Upward Growth Arrow (Double Layered Gold & Green) -->
    <path d="M22 28l9-12 8 5 15-16" stroke="#EFA91F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M44 5h10v10" stroke="#EFA91F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M22 27l9-12 8 5 15-16" stroke="#185834" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M44 6h9v9" stroke="#185834" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography: cuan.in -->
  <text x="76" y="44" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="38" font-weight="800" letter-spacing="-1px">
    <tspan fill="#185834">cuan</tspan><tspan fill="#EFA91F">.in</tspan>
  </text>

  <!-- Tagline: Own Your Profit. No Commission Fees. -->
  <text x="77" y="60" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#185834" letter-spacing="0.3px">
    Own Your Profit. No Commission Fees.
  </text>
</svg>
